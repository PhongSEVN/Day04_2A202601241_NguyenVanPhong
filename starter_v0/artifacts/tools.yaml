# starter_v0 — tool declarations with clear routing guidance.
# Names and descriptions here should make tool roles and required arguments unambiguous.
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for missing or ambiguous information needed to choose a tool or fill required arguments."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "A direct clarifying question for the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected answer format."}
        options: {type: array, default: [], items: {type: string}, description: "Choice options when response_type=choice."}
      required: [question]

  - name: timeline
    description: "Fetch recent tweets for a specific known Twitter handle. Use only when the user asks for tweets from a named person or account."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle without @, e.g. sama."}
        limit: {type: integer, default: 5, description: "Maximum number of tweets to retrieve."}
      required: [screenname]

  - name: social_search
    description: "Search social media for posts or tweets matching a topic or query. Use when the user asks about what people are saying, not about a specific user."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query or topic."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sort by latest or top posts."}
        limit: {type: integer, default: 5, description: "Maximum number of results."}
      required: [query]

  - name: lookup
    description: "Perform a general web or news lookup. Set topic=news for current news requests and choose an appropriate timeframe when the user asks for recent coverage."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Web search query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use news when the user asks for news; otherwise general."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Requested time window for results."}
        max_results: {type: integer, default: 5, description: "Maximum number of results."}
      required: [query]

  - name: fetch
    description: "Fetch the content from a specified URL. Use when the user asks to read, summarize, or retrieve text from a provided link."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The full URL to fetch content from."}
      required: [url]

  - name: format
    description: "Format an existing list of items into human-readable text. Use only when the agent already has structured item data and needs to render it."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "A list of structured items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output style template."}
        headline: {type: string, default: "", description: "Optional headline or title for the formatted output."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send or publish a prepared text response. Use only when the user explicitly requests sending, posting, or dispatching content."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The final text to send."}
        confirmed: {type: boolean, default: false, description: "Whether the content has been confirmed as final."}
      required: [text]

  - name: policy
    description: "Search internal policy documents when the user asks about AI research policy, source citation, data privacy, external publishing, or tool usage policy."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy search query."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Select a specific policy area if known."}
        top_k: {type: integer, default: 3, description: "Maximum number of policy documents or passages to return."}
      required: [query]

  - name: papers
    description: "Search for scientific papers by keyword. Use only when the user asks about academic papers or research literature."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Maximum number of paper results."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order for paper results."}
      required: [query]

  - name: paper_text
    description: "Retrieve text content from a paper when the user provides a paper identifier or URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ArXiv URL or paper identifier."}
        max_pages: {type: integer, default: 5, description: "Maximum number of pages to retrieve."}
        max_chars: {type: integer, default: 8000, description: "Maximum number of characters to retrieve."}
      required: [arxiv_url]

  - name: dataset_lookup
    description: "Search the team's local dataset of 200 heart-rate-variability paper records (OpenAlex metadata) by paper title, author name, DOI, or OpenAlex ID. Prefer this over a web search when the user names a specific paper or author; it is offline and returns exact metadata (year, DOI, citation count). It returns metadata only — it has no abstract or full text."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper title, author name, DOI, or OpenAlex ID."}
        publication_year: {type: integer, description: "Only return papers published in this exact year."}
        max_results: {type: integer, default: 5, description: "Maximum number of paper records to return (1-10)."}
      required: [query]
